name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compilar-e-testar:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar
        run: dotnet restore CVExplorer.slnx

      - name: Compilar
        run: dotnet build CVExplorer.slnx -c Release --no-restore --nologo

      - name: Testes
        run: dotnet test tests/CVExplorer.Tests/CVExplorer.Tests.csproj -c Release --no-build --nologo
