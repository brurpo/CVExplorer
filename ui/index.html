<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CV Explorer</title>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/app.css" />
  <script>
    // Antes do primeiro paint: evita o flash branco/escuro ao abrir a janela.
    try {
      document.documentElement.dataset.tema =
        localStorage.getItem('cvexplorer:tema') === 'claro' ? 'claro' : 'escuro';
    } catch {
      document.documentElement.dataset.tema = 'escuro';
    }
  </script>
</head>
<body>
  <header class="titlebar" id="titlebar">
    <img class="titlebar-logo" src="./img/logo.png" alt="" draggable="false" />
    <span class="titlebar-titulo">CV Explorer</span>
    <div class="titlebar-arraste" id="titlebar-arraste"></div>
    <div class="janela-botoes">
      <button id="btn-tema" class="janela-btn tema-btn" data-i18n-title="tema.alternar">
        <svg class="icone-lua" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
        <svg class="icone-sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.6" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" /></svg>
      </button>
      <button id="btn-janela-min" class="janela-btn" data-i18n-title="janela.minimizar">
        <svg viewBox="0 0 12 12"><path d="M2.5 6h7" /></svg>
      </button>
      <button id="btn-janela-max" class="janela-btn" data-i18n-title="janela.maximizar">
        <svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg>
      </button>
      <button id="btn-janela-fechar" class="janela-btn fechar" data-i18n-title="janela.fechar">
        <svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" /></svg>
      </button>
    </div>
  </header>

  <header class="topbar">
    <button id="chip-projeto" class="chip-projeto" data-i18n-title="projeto.foraDeProjeto">
      <span class="chip-dot"></span>
      <span id="chip-projeto-nome">Sem projeto</span>
      <svg viewBox="0 0 24 24" class="chip-chevron"><path d="M6 9l6 6 6-6" /></svg>
    </button>

    <div class="nav-group">
      <button id="btn-voltar" class="icon-btn" data-i18n-title="nav.voltar" disabled>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <button id="btn-avancar" class="icon-btn" data-i18n-title="nav.avancar" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
      </button>
      <button id="btn-subir" class="icon-btn" data-i18n-title="nav.subir">
        <svg viewBox="0 0 24 24"><path d="M12 19V6M6 12l6-6 6 6" /></svg>
      </button>
    </div>

    <div class="endereco" id="endereco-area">
      <nav id="migalhas" class="breadcrumb" aria-label="Caminho"></nav>
      <input id="endereco" class="endereco-input" type="text" hidden spellcheck="false" autocomplete="off" />
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="7" /><path d="M16.5 16.5L21 21" /></svg>
      <input id="busca" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="busca.placeholder" />
      <button id="busca-limpar" class="chip-x" hidden data-i18n-title="busca.limpar">×</button>
    </div>

    <div class="actions">
      <button id="btn-preview" class="icon-btn ativo" data-i18n-title="acoes.previa">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
      <button id="btn-atualizar" class="icon-btn" data-i18n-title="acoes.atualizar">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
      </button>
      <button id="btn-visualizacao" class="icon-btn" data-i18n-title="acoes.visualizacao">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </button>
      <button id="btn-nova-janela" class="icon-btn" data-i18n-title="acoes.novaJanela">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M8 3h13v12"/></svg>
      </button>
      <button id="btn-novo" class="icon-btn" data-i18n-title="acoes.novo">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
      </button>
      <button id="btn-config" class="icon-btn" data-i18n-title="acoes.config">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <!-- Último ícone da barra: baixar a versão nova. O desenho é de propósito
           diferente do ↻ de atualizar a pasta, que fica no começo. -->
      <button id="btn-verificar-atualizacao" class="icon-btn" data-i18n-title="acoes.verificarAtualizacao">
        <svg viewBox="0 0 24 24"><path d="M12 3.5v10"/><path d="M8.1 9.6 12 13.5l3.9-3.9"/><path d="M4.5 16v2.5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V16"/></svg>
      </button>
      <button id="btn-atualizacao" class="update-pill" hidden></button>
    </div>
  </header>

  <nav id="abas" class="abas" role="tablist">
    <div id="abas-lista" class="abas-lista"></div>
    <button id="aba-nova" class="aba-nova" data-i18n-title="abas.nova" aria-label="Nova aba">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
    </button>
  </nav>

  <div class="shell">
    <aside class="sidebar">
      <section class="side-section">
        <header class="side-header">
          <span data-i18n="lateral.computador">Este Computador</span>
          <button id="btn-atualizar-drives" class="mini-btn" data-i18n-title="lateral.atualizarDiscos">⟳</button>
        </header>
        <div id="lista-drives" class="side-list"></div>
      </section>

      <section id="secao-favoritos" class="side-section drop-favoritos">
        <header class="side-header">
          <span data-i18n="lateral.favoritos">Favoritos</span>
          <button id="btn-add-favorito" class="mini-btn" data-i18n-title="lateral.adicionarFavorito">+</button>
        </header>
        <div id="lista-favoritos" class="side-list"></div>
      </section>
    </aside>

    <main class="conteudo">
      <div id="cabecalho-lista" class="col-cabecalho" hidden></div>
      <div id="area-itens" class="area-itens" tabindex="0"></div>
      <div id="digitacao" class="digitacao" hidden></div>
      <div id="vazio" class="vazio" hidden>
        <div class="vazio-icone">◇</div>
        <p class="vazio-titulo" data-i18n="vazio.titulo">Pasta vazia</p>
        <p class="vazio-texto" data-i18n="vazio.texto">Arraste arquivos para cá ou use Ctrl+V.</p>
      </div>
    </main>

    <div id="divisor-preview" class="divisor-preview"></div>

    <aside id="preview" class="preview">
      <header class="preview-header">
        <span id="preview-nome" class="preview-nome"></span>
        <button id="preview-fechar" class="mini-btn" data-i18n-title="preview.recolher">⟩</button>
      </header>
      <div id="preview-corpo" class="preview-corpo"></div>
      <footer id="preview-meta" class="preview-meta"></footer>
    </aside>
  </div>

  <section id="relatorio" class="relatorio" hidden>
    <header class="relatorio-topo">
      <div>
        <h1 id="relatorio-nome" class="relatorio-titulo">Pastas maiores</h1>
        <p id="relatorio-resumo" class="relatorio-resumo"></p>
      </div>
      <div class="relatorio-acoes">
        <button id="relatorio-atualizar" class="btn">Atualizar</button>
      </div>
    </header>
    <div id="relatorio-corpo" class="relatorio-corpo"></div>
  </section>

  <section id="previa-rapida" class="previa-rapida" hidden>
    <header class="previa-rapida-topo">
      <span id="previa-rapida-nome" class="previa-rapida-nome"></span>
      <div id="previa-rapida-som" class="previa-rapida-som" hidden></div>
      <div id="previa-pdf-acoes" class="previa-rapida-acoes" hidden>
        <button id="pdf-anterior" class="btn previa-btn" data-i18n-title="pdf.anterior">◀</button>
        <span id="pdf-pagina" class="pdf-pagina">1 / 1</span>
        <button id="pdf-proxima" class="btn previa-btn" data-i18n-title="pdf.proxima">▶</button>
        <button id="pdf-zoom-menos" class="btn previa-btn" data-i18n-title="pdf.menosZoom">−</button>
        <button id="pdf-ajustar" class="btn previa-btn" data-i18n-title="pdf.ajustar">⤢</button>
        <button id="pdf-zoom-mais" class="btn previa-btn" data-i18n-title="pdf.maisZoom">+</button>
        <button id="pdf-girar" class="btn previa-btn" data-i18n="pdf.girar"></button>
        <button id="pdf-mover-esq" class="btn previa-btn" data-i18n-title="pdf.moverEsquerda">⇤</button>
        <button id="pdf-mover-dir" class="btn previa-btn" data-i18n-title="pdf.moverDireita">⇥</button>
        <button id="pdf-excluir" class="btn previa-btn" data-i18n="pdf.excluir"></button>
        <button id="pdf-extrair" class="btn previa-btn" data-i18n="pdf.extrair"></button>
        <button id="pdf-salvar" class="btn previa-btn pdf-salvar" data-i18n="pdf.salvar" disabled></button>
        <button id="pdf-descartar" class="btn previa-btn" data-i18n="pdf.descartar" disabled></button>
      </div>
      <div id="previa-rapida-acoes" class="previa-rapida-acoes" hidden>
        <label class="previa-campo">
          <span data-i18n="previa.ambiente"></span>
          <select id="previa-ambiente" class="previa-select"></select>
        </label>
        <button id="previa-hdri" class="btn previa-btn" data-i18n="previa.carregarHdri"></button>
        <label id="previa-exposicao-campo" class="previa-campo">
          <span data-i18n="previa.exposicao"></span>
          <input id="previa-exposicao" type="range" min="-300" max="300" step="10" value="0" />
        </label>
        <button id="previa-latlong" class="btn previa-btn" hidden></button>
      </div>
      <span class="previa-rapida-dica" data-i18n="previa.dica3d"></span>
    </header>
    <div id="previa-rapida-corpo" class="previa-rapida-corpo"></div>
  </section>

  <footer class="statusbar">
    <span id="status-itens" class="status-item"></span>
    <span id="status-selecao" class="status-item"></span>
    <span class="status-spacer"></span>
    <span id="status-busca" class="status-item"></span>
    <span class="status-zoom" id="status-zoom">
      <svg viewBox="0 0 24 24" class="status-zoom-icone"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <input id="slider-grade" class="status-slider" type="range" min="96" max="340" step="4" data-i18n-title="acoes.tamanhoMiniatura" />
    </span>
    <span id="status-espaco" class="status-item"></span>
    <span id="status-versao" class="status-item muted"></span>
  </footer>

  <div id="arraste-alvo" class="arraste-alvo" hidden>
    <div class="arraste-caixa">
      <div class="arraste-texto"></div>
      <div class="arraste-pasta"></div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>  <div id="progressos" class="progressos"></div>
  <div id="menu-contexto" class="menu-contexto" hidden></div>
  <div id="modal-raiz" class="modal-raiz" hidden></div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.min.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
